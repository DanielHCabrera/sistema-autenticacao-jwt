<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Cadastro</title>
        <link rel="stylesheet" href="style.css?v=5">
    </head>
    <body>
        <div class="login-container">
        <h1>Criar conta</h1>
        <form id="cadastroForm">
         <div class="input-group">
            <label for="nome">Nome completo</label>
            <input type="text" id="nome" placeholder="Digite seu nome completo" required>
         </div>
         <div class="input-group">
            <label for="email">E-mail</label>
            <input type="email" id="email" placeholder="Digite seu e-mail" required>
         </div>
         <div class="input-group">
            <label for="senha">Senha</label>
            <input type="password" id="senha" placeholder="Digite sua senha" required minlength="6">
         </div>
         <div class="input-group">
            <label for="confirmarSenha">Confirmar senha</label>
            <input type="password" id="confirmarSenha" placeholder="Digite a senha novamente" required minlength="6">
         </div>
         <div class="input-group">
            <label for="dataNascimento">Data de nascimento</label>
            <input type="date" id="dataNascimento" required>
         </div>
         <div class="input-group">
            <label for="telefone">Telefone</label>
            <input type="tel" id="telefone" placeholder="(00) 00000-0000" required>
         </div>
         <div class="input-group">
            <label for="cargo">Cargo</label>
            <input type="text" id="cargo" placeholder="Digite seu cargo" required>
         </div>
         <button type="submit">Cadastrar</button>
         </form>
         <p id="mensagem"></p>
         <p class="link-alternativo"><a href="index.html">Já tem uma conta? Faça login</a></p>
         </div>
         <script src="cadastro.js"></script>
    </body>
    </html>
