<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Esqueci minha senha</title>
        <link rel="stylesheet" href="style.css?v=5">
    </head>
    <body>
        <div class="login-container">
        <h1>Esqueci minha senha</h1>
        <p>Digite seu e-mail cadastrado. Se ele existir em nossa base, enviaremos um link para redefinir sua senha.</p>
        <form id="esqueciSenhaForm">
         <div class="input-group">
            <label for="email">E-mail</label>
            <input type="email" id="email" placeholder="Digite seu e-mail" required>
         </div>
         <button type="submit">Enviar link de redefinição</button>
         </form>
         <p id="mensagem"></p>
         <p class="link-alternativo"><a href="index.html">Voltar para o login</a></p>
         </div>
         <script src="esqueci-senha.js"></script>
    </body>
    </html>
