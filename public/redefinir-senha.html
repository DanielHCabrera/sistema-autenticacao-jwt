<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Redefinir senha</title>
        <link rel="stylesheet" href="style.css?v=5">
    </head>
    <body>
        <div class="login-container">
        <h1>Redefinir senha</h1>
        <form id="redefinirSenhaForm">
         <div class="input-group">
            <label for="novaSenha">Nova senha</label>
            <input type="password" id="novaSenha" placeholder="Digite a nova senha" required minlength="8">
         </div>
         <div class="input-group">
            <label for="confirmarSenha">Confirmar nova senha</label>
            <input type="password" id="confirmarSenha" placeholder="Digite a nova senha novamente" required minlength="8">
         </div>
         <button type="submit">Redefinir senha</button>
         </form>
         <p id="mensagem"></p>
         <p class="link-alternativo"><a href="index.html">Voltar para o login</a></p>
         </div>
         <script src="redefinir-senha.js"></script>
    </body>
    </html>
